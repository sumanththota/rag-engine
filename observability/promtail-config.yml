server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/rag-engine-promtail-positions.yaml

clients:
  - url: http://localhost:3100/loki/api/v1/push

scrape_configs:
  # trace_id/req_id are NOT labels -- Loki indexes labels, and a new label
  # value per request would blow up that index. They stay inside the JSON
  # line, extracted at query time with `| json`.
  - job_name: rag-server
    pipeline_stages:
      - json:
          expressions:
            level: level
            stage: stage
      - labels:
          level:
          stage:
    static_configs:
      - targets: [localhost]
        labels:
          job: rag-server
          service: rag-engine
          __path__: /Users/sumanththota/Dev/AI/Agents loops/RAG/rag-migration/rag-engine/logs/rag-engine.log
