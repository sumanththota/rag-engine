[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pypdf>=5.0",
    "python-multipart>=0.0.12",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "authlib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.setuptools]
packages = ["app", "observability"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
